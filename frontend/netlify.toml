[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — every unknown path serves index.html so client-side
# routing (if ever added) works from cold links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Default production headers. All cached assets in /assets are content-hashed
# by Vite, so they're safe to cache for a year; index.html must revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
