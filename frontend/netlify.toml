[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every unknown path serves index.html so the client-side routes
# (/launchpad, /launchpad/create, /launchpad/token/:address) work from cold links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Default production headers. All cached assets in /assets are content-hashed
# by Vite, so they're safe to cache for a year; index.html must revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers on every path. The SPA rewrite serves index.html for /launchpad/..., which the
# /index.html rule above doesn't match, so these live here (once, so values never get merged twice).
# The launchpad renders creator-supplied token metadata; the CSP is a second line of defence behind the
# React escaping and URL allowlists: no inline, injected or third-party script can run, nothing can frame
# the site, and <base>/<form> can't be repointed. img-src allows https: (token logos) and data: (the
# on-chain pass SVG, wallet icons); connect-src allows any https/wss RPC plus a local node for dev.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
